name: Apply Android pricing correction (temporary)
on:
  push:
    branches: [fix/landing-pitch-premium]
    paths:
      - '_build/update_android_pricing.py'
      - '.github/workflows/update-android-pricing.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/landing-pitch-premium'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/landing-pitch-premium
      - name: Update only Google Play pricing
        run: |
          python3 _build/update_android_pricing.py
          node _build/test_pitch.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_build/apply_landing_fixes.py')
          s=p.read_text()
          if 'runpy.run_path' not in s:
              s+='\n# Keep Google Play pricing consistent with the current product plans.\nimport runpy\nrunpy.run_path(str(ROOT / "_build/update_android_pricing.py"), run_name="__main__")\n'
              p.write_text(s)
          PY
      - name: Commit corrections to PR branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' _build/apply_landing_fixes.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: apply Google Play monthly yearly and lifetime prices in six languages'
            git push origin HEAD:fix/landing-pitch-premium
          fi
