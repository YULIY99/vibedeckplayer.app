name: Complete pricing FAQ correction (temporary)
on:
  push:
    branches: [fix/landing-pitch-premium]
    paths: ['.github/workflows/update-android-pricing.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/landing-pitch-premium
      - name: Correct Premium FAQ matching and regenerate only prices
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_build/update_android_pricing.py')
          s=p.read_text()
          old="    if 'Premium' in text and ((('Google Play' in text or 'ストア' in text) and PRICE_WORDS.search(text)) or (home and 'Premium' in question)):"
          new="    if ('Premium' in text and ('Google Play' in text or 'ストア' in text) and PRICE_WORDS.search(text)) or (home and 'Premium' in question):"
          assert old in s or new in s
          p.write_text(s.replace(old,new))
          PY
          python3 _build/update_android_pricing.py
          node _build/test_pitch.js
      - name: Commit to PR branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' _build/update_android_pricing.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: synchronize Premium FAQ prices in all six languages'
            git push origin HEAD:fix/landing-pitch-premium
          fi
