name: Fix specs price-note spacing
on:
  push:
    branches: [fix/specs-price-note-spacing]
    paths: [.github/workflows/fix-spec-spacing.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted spacing and refresh stylesheet cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('styles.css')
          text=p.read_text()
          anchor='.table-wrap{overflow-x:auto;border-radius:var(--r-md);border:1px solid var(--line)}'
          addition='\n/* Keep the regional-price note clear of the table, near the card footer. */\n.box.prose:has(> .table-wrap + p.dim:last-child){padding-bottom:clamp(24px,3vw,32px)}\n.box.prose > .table-wrap + p.dim:last-child{margin:clamp(32px,4vw,48px) 0 0}'
          assert text.count(anchor)==1
          assert addition not in text
          p.write_text(text.replace(anchor,anchor+addition))
          p=Path('index.html')
          text=p.read_text()
          assert text.count('/styles.css?v=13')==1
          p.write_text(text.replace('/styles.css?v=13','/styles.css?v=14'))
          PY
      - run: node _build/test_pitch.js && node _build/test_pitch_idle.js
      - name: Commit fix and remove temporary workflow
        run: |
          git rm .github/workflows/fix-spec-spacing.yml
          git add styles.css index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: place regional-price note near specs card footer'
          git push
