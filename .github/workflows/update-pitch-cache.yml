name: Update pitch asset versions (temporary)
on:
  push:
    branches: [fix/pitch-idle-motion]
    paths: ['.github/workflows/update-pitch-cache.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pitch-idle-motion
      - name: Update cache versions only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['index.html','_build/apply_landing_fixes.py']:
              p=Path(name)
              s=p.read_text().replace('/assets/site.js?v=3','/assets/site.js?v=4').replace('/assets/landing-controls.css?v=1','/assets/landing-controls.css?v=2')
              p.write_text(s)
          PY
          node _build/test_pitch.js
          node _build/test_pitch_idle.js
      - name: Commit asset versions to fix branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html _build/apply_landing_fixes.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: invalidate pitch JS and CSS cache'
            git push origin HEAD:fix/pitch-idle-motion
          fi
