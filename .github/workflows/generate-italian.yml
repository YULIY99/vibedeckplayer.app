name: Generate Italian localization
on:
  push:
    branches: [feat/italian-localization]
    paths: [.github/workflows/generate-italian.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install beautifulsoup4
      - name: Restore verified source files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,base64,zlib,json
          s=''.join(Path(f'_build/italian_parts/{i}.txt').read_text() for i in range(7))
          assert hashlib.sha256(s.encode()).hexdigest()=='95c554f91dc7d269e72f37bd7f8faecfce562ef2ff8eca12df51c158211164a3'
          data=json.loads(zlib.decompress(base64.b64decode(s,validate=True)))
          for name,content in data.items():
              assert name in ['_build/add_italian.py','_build/italian_translations.json','_build/italian_source.sha256']
              Path(name).write_text(content,encoding='utf-8')
          PY
      - run: python3 _build/add_italian.py
      - run: node _build/test_pitch.js && node _build/test_pitch_idle.js
      - name: Verify Italian pages and idempotence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json,hashlib,subprocess
          for p in Path('it').rglob('index.html'):
              s=BeautifulSoup(p.read_text(),'html.parser')
              assert s.html['lang']=='it'
              assert s.select_one('link[rel="canonical"]')['href']=='https://vibedeckplayer.app/'+str(p.parent)+'/'
              for j in s.select('script[type="application/ld+json"]'):json.loads(j.string)
              assert len(s.select('a[lang="it"],span[lang="it"]'))==1
          def snapshot():return {str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts}
          before=snapshot()
          subprocess.run(['python3','_build/add_italian.py'],check=True)
          assert before==snapshot(),'Generator is not idempotent'
          print('PASS Italian canonical, language, JSON-LD and exact idempotence')
          PY
      - name: Commit clean generated output
        run: |
          git rm -r _build/italian_parts _build/italian_payload.b64 .github/workflows/generate-italian.yml
          git add _build/add_italian.py _build/italian_translations.json _build/italian_source.sha256 it *.html ja es pt-br de fr change-song-key-iphone flac-player-iphone mp3-player-no-ads sitemap.xml llms.txt llms-full.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add Italian home and three guides with reciprocal SEO links'
          git push
